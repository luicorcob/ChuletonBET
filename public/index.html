<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B112C">
<title>ChuletonBet · La peña del fútbol, vino y chuletón</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Bree+Serif&display=swap');
:root { color-scheme: dark; --bg:#081426;--surface:#101f34;--surface2:#15283e;--line:#263c55;--fg:#ecf3f9;--muted:#90a5bc;--lime:#c5ff69;--blue:#7fb8ff;--amber:#ffd28a;--red:#ff9d9b; }
* { box-sizing:border-box; }
html {scroll-behavior:smooth;}
body {margin:0; color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:radial-gradient(ellipse 80% 42% at 90% -5%,#17456a88,transparent 78%),radial-gradient(ellipse 65% 35% at 0% 8%,#174a4b60,transparent 75%),var(--bg);min-height:100vh;}
button,input,select {font:inherit;}
button {cursor:pointer;}
button:disabled {opacity:.4;cursor:not-allowed;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:3px;}
.container {max-width:1220px;margin:auto;padding:0 22px;}
.top {border-bottom:1px solid #ffffff10;background:#0814266f;backdrop-filter:blur(22px);}
.top-inner {display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:85px;}
.logo {display:flex;align-items:center;gap:13px;color:var(--fg);text-decoration:none;}
.logo-mark {display:grid;place-items:center;width:43px;height:43px;background:var(--lime);color:#062119;border-radius:14px;font-size:24px;box-shadow:0 4px 30px #b7f86635;}
.logo-title {display:block;font-weight:900;letter-spacing:-.6px;font-size:17px;line-height:1.1;}
.logo-sub {display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.6px;margin-top:5px;text-transform:uppercase;}
.session {display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.player-select {border:1px solid var(--line);background:#162940;color:var(--fg);border-radius:12px;min-height:43px;padding:0 14px;font-size:13px;max-width:150px;}
.pill {border:1px solid var(--line);background:#172a3c;color:var(--muted);padding:9px 13px;border-radius:50px;font-size:12px;font-weight:700;}
.pill.light {background:#c5ff691c;border-color:#c5ff6960;color:var(--lime);}
.hero {padding:43px 0 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;}
.eyebrow {color:var(--lime);font-size:11px;letter-spacing:2.2px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.eyebrow:before {content:"";height:7px;width:7px;border-radius:100%;background:var(--lime);box-shadow:0 0 12px #baff6a;}
h1 {margin:12px 0 12px;font-size:clamp(37px,5.2vw,66px);line-height:1.03;letter-spacing:-2.7px;font-weight:900;}
h1 em {font-style:normal;color:var(--lime);}
.hero p {max-width:630px;color:var(--muted);margin:0;line-height:1.6;font-size:14px;}
.week-tools {display:flex;align-items:center;gap:10px;background:#0d2136;border:1px solid var(--line);border-radius:16px;padding:7px;white-space:nowrap;}
.week-tools span {font-size:12px;font-weight:800;text-align:center;min-width:148px;}
.square {background:#1d344c;border:1px solid #315069;border-radius:11px;color:white;width:35px;height:35px;font-size:22px;display:grid;place-items:center;}
.grid-metrics {display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:10px 0 23px;}
.metric {background:linear-gradient(125deg,#14273b,#101d30);border:1px solid var(--line);border-radius:18px;padding:20px 19px;min-height:117px;}
.metric .k {font-size:12px;color:var(--muted);font-weight:650;}
.metric .v {font-size:34px;letter-spacing:-1px;font-weight:900;margin-top:12px;line-height:1;}
.metric .v small {font-size:14px;color:var(--muted);letter-spacing:0;font-weight:700;}
.metric.accent {background:linear-gradient(125deg,#d8ff80,#aaf36c);color:#14241a;border-color:#d8ff80;}
.metric.accent .k,.metric.accent .v small {color:#2e4a35;}
.alert {border:1px solid #9b623f8a;background:#3b2a274d;color:#f7dbb9;border-radius:13px;padding:12px 15px;font-size:13px;line-height:1.5;margin:0 0 14px;}
.alert.warn {border-color:#685b44;background:#29271f;color:#d7c3a6;}
.alert.success {border-color:#517953;background:#153b2d;color:#bfffab;}
.main-card {border:1px solid var(--line);border-radius:23px;background:#102037b0;overflow:hidden;box-shadow:0 14px 50px #00000012;}
.nav {display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);overflow:auto;}
.nav button {flex:1;border:0;border-radius:12px;padding:13px 13px;background:transparent;color:#9db1c5;font-size:13px;font-weight:750;white-space:nowrap;}
.nav button.active {background:#c5ff6918;color:var(--lime);}
.nav button .bubble {border-radius:30px;background:#24435c;padding:3px 7px;margin-left:6px;font-size:11px;}
.content {padding:26px;}
.panel-heading {display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:21px;}
h2 {font-size:21px;letter-spacing:-.5px;margin:0;font-weight:850;}
.description {color:var(--muted);font-size:13px;line-height:1.6;margin:7px 0 0;}
.btn {border:1px solid var(--line);border-radius:12px;background:#1c354b;color:var(--fg);font-size:13px;font-weight:800;padding:12px 16px;white-space:nowrap;transition:transform .12s,background .15s;}
.btn:not(:disabled):hover {transform:translateY(-1px);background:#29445d;}
.btn.primary {border-color:var(--lime);background:var(--lime);color:#122415;}
.btn.primary:hover {background:#d4ff92;}
.btn.ghost {background:transparent;}
.btn.small {font-size:11px;padding:8px 10px;border-radius:9px;}
.btn.danger {border-color:#7e3c41;color:var(--red);background:#4b252a;}
.draft-layout {display:grid;grid-template-columns:minmax(0,1.45fr) minmax(310px,.8fr);gap:21px;align-items:start;}
.fixtures-wrap {min-width:0;}
.filterbar {display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px;}
.filter {border:1px solid var(--line);background:#0b1b2e;border-radius:11px;color:var(--fg);padding:11px 12px;flex:1;min-width:145px;font-size:13px;}
.filter-label {font-size:12px;color:var(--muted);}
.chips {display:flex;gap:6px;flex-wrap:wrap;}
.chip {border:1px solid var(--line);background:#162b41;color:var(--muted);border-radius:25px;padding:8px 11px;font-size:11px;font-weight:800;}
.chip.on {border-color:#a6e86c99;color:var(--lime);background:#b7ff621a;}
.match {border:1px solid var(--line);border-radius:15px;background:#12263b;margin-bottom:11px;padding:15px;transition:border-color .15s;}
.match:hover {border-color:#47617c;}
.match.used {border-color:#a7e76a72;}
.match-top {display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:13px;}
.match-teams {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px;}
.team {display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.team:last-child {text-align:right;justify-content:flex-end;}
.team img {height:26px;width:26px;object-fit:contain;flex-shrink:0;}
.team span {font-size:14px;font-weight:820;line-height:1.25;}
.vs {color:#6c88a2;font-size:10px;font-weight:900;letter-spacing:1px;padding:0 7px;}
.market-row {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
.market-btn {background:#1b334a;color:#d4e4f3;border:1px solid #304c66;border-radius:9px;padding:9px 3px;font-size:10px;min-width:0;line-height:1.5;}
.market-btn strong {display:block;font-size:13px;}
.market-btn.chosen {background:#c5ff69;color:#15311b;border-color:#c5ff69;}
.market-btn.missing strong {color:#708a9d;}
.market-btn:disabled {opacity:.48;}
.draft-sidebar {position:sticky;top:14px;border:1px solid var(--line);background:#0b192c;border-radius:18px;padding:19px;}
.sidebar-top {display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;}
.sidebar-top h3 {margin:0;font-size:17px;}
.counter {font-size:12px;font-weight:800;color:var(--lime);}
.slot {display:flex;align-items:center;gap:10px;border:1px dashed #37516a;border-radius:12px;min-height:65px;padding:11px 10px;margin-bottom:9px;}
.slot.filled {border-style:solid;background:#172c40;}
.slot-num {display:grid;place-items:center;height:26px;width:26px;border-radius:9px;background:#26415b;color:var(--muted);font-size:11px;font-weight:900;flex-shrink:0;}
.slot .slot-info {flex:1;min-width:0;}
.slot strong {font-size:12px;display:block;line-height:1.25;}
.slot small {font-size:11px;color:var(--muted);display:block;margin-top:4px;line-height:1.4;}
.slot .price {font-size:14px;font-weight:900;color:var(--lime);white-space:nowrap;}
.slot .remove {background:transparent;color:var(--muted);border:0;padding:4px 3px;font-size:19px;}
.combined {border:1px solid #c5ff6960;background:linear-gradient(140deg,#1d4a3a,#132b34);border-radius:14px;padding:19px;margin-top:17px;}
.combined small {color:#b3d4c0;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;}
.combined b {display:block;color:var(--lime);font-size:38px;letter-spacing:-1px;margin-top:4px;}
.combined p {color:#b9cbbb;font-size:11px;line-height:1.5;margin:5px 0 0;}
.side-actions {margin-top:13px;display:grid;gap:9px;}
.note {font-size:11px;color:var(--muted);line-height:1.5;margin:9px 0 0;}
.legend {font-size:11px;color:var(--muted);margin-bottom:14px;}
.empty {border:1px dashed #34516b;border-radius:15px;padding:36px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;}
.empty .emoji {font-size:32px;margin-bottom:8px;}
.rank-list {display:grid;gap:9px;}
.rank-row {display:flex;align-items:center;gap:15px;background:#13283d;border:1px solid var(--line);border-radius:13px;padding:13px 15px;}
.rank-num {display:grid;place-items:center;flex-shrink:0;width:31px;height:31px;border-radius:11px;background:#243e55;color:#bdcddd;font-weight:900;font-size:13px;}
.rank-row.top {border-color:#b8f76b72;background:linear-gradient(90deg,#26463a,#142b3a);}
.rank-row.top .rank-num {background:var(--lime);color:#162913;}
.rank-body {flex:1;min-width:0;}
.rank-body strong {font-size:13px;display:block;}
.rank-body small {display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45;}
.rank-points {display:flex;align-items:center;gap:11px;flex-shrink:0;}
.rank-stat {text-align:center;min-width:36px;}
.rank-stat b {font-size:17px;display:block;}
.rank-stat span {font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;}
.status-chip {display:inline-block;border-radius:7px;background:#c5ff6921;color:var(--lime);padding:4px 7px;margin-left:4px;font-size:10px;font-weight:800;}
.status-chip.wait {background:#ffd28a21;color:var(--amber);}
.two-col {display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start;}
.vote-choice {border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;background:#14283b;display:flex;gap:12px;align-items:center;}
.vote-choice .check {height:25px;width:25px;border-radius:9px;border:2px solid #55708c;background:#21384b;display:grid;place-items:center;font-size:15px;color:#09261c;flex-shrink:0;}
.vote-choice.selected {border-color:#b8f76b7a;background:#1e423a;}
.vote-choice.selected .check {background:var(--lime);border-color:var(--lime);}
.vote-choice .body {flex:1;min-width:0;}
.vote-choice b {display:block;font-size:12px;line-height:1.4;}
.vote-choice small {display:block;font-size:11px;margin-top:4px;color:var(--muted);}
.vote-choice .count {font-size:13px;font-weight:900;color:var(--lime);white-space:nowrap;}
.vote-choice button {border:0;background:none;color:inherit;text-align:left;width:100%;display:flex;align-items:center;gap:12px;padding:0;}
.block {border:1px solid var(--line);background:#102237;border-radius:17px;padding:20px;}
.block h3 {margin:0 0 10px;font-size:16px;}
.block p {color:var(--muted);font-size:12px;line-height:1.6;margin:7px 0 16px;}
.final-item {display:flex;gap:10px;align-items:center;border-bottom:1px solid #2b4659;padding:11px 0;}
.final-item:last-of-type{border-bottom:0;}
.final-item .n {display:grid;place-items:center;flex-shrink:0;width:25px;height:25px;border:1px solid #a4d762;border-radius:7px;color:var(--lime);font-size:12px;font-weight:900;}
.final-item .detail {flex:1;min-width:0;}
.final-item .detail strong {display:block;font-size:12px;}
.final-item .detail small {font-size:11px;color:var(--muted);}
.final-item .p {color:var(--lime);font-size:14px;font-weight:800;}
.final-total {display:flex;align-items:center;justify-content:space-between;color:var(--muted);margin-top:15px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;}
.final-total b {color:var(--lime);font-size:26px;}
.people {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;}
.person {border:1px solid var(--line);border-radius:16px;background:#14283e;padding:17px;}
.person-title {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.avatar {display:grid;place-items:center;width:33px;height:33px;border-radius:12px;background:#2a5164;color:var(--lime);font-weight:900;}
.person-title b {margin-right:auto;font-size:14px;}
.person-row {display:flex;justify-content:space-between;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid #274057;font-size:11px;line-height:1.5;}
.person-row .price {color:var(--lime);font-weight:900;white-space:nowrap;}
.person-row strong {display:block;font-size:11px;}
.person-row span {color:var(--muted);}
.person-total {font-size:11px;color:var(--muted);padding-top:12px;}
.person-total b {font-size:20px;color:var(--lime);margin-left:7px;}
.league-groups {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;}
.team-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.team-tile {border:1px solid var(--line);background:#14293d;border-radius:11px;display:flex;align-items:center;gap:10px;padding:10px;font-size:12px;font-weight:750;min-height:55px;}
.team-tile img {width:28px;height:28px;object-fit:contain;}
.footer {padding:27px 0 38px;display:flex;align-items:center;justify-content:space-between;gap:15px;color:#718ba4;font-size:11px;line-height:1.5;}
.overlay {position:fixed;inset:0;background:#04101acb;backdrop-filter:blur(5px);display:grid;place-items:center;z-index:10;padding:16px;}
.modal {background:#15283b;border:1px solid #45617a;border-radius:20px;padding:26px;max-width:410px;width:100%;box-shadow:0 20px 100px #0008;}
.modal h2 {margin-bottom:6px;}
.modal p {font-size:13px;color:var(--muted);line-height:1.6;}
.modal input {width:100%;background:#0b1b2e;border:1px solid #466077;border-radius:10px;color:white;padding:12px;margin:8px 0 14px;}
.modal-actions {display:flex;gap:10px;}
.spin {display:inline-block;width:23px;height:23px;border:3px solid #567389;border-top-color:var(--lime);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin {to {transform:rotate(360deg);}}
@media(max-width:950px){.draft-layout,.two-col,.league-groups{grid-template-columns:1fr}.draft-sidebar{position:static}.hero{align-items:flex-start;flex-direction:column}.grid-metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.container{padding:0 13px}.hero{padding:28px 2px 22px}h1{letter-spacing:-1.9px}.top-inner{min-height:75px}.pill.desktop{display:none}.logo-sub{font-size:9px}.logo-title{font-size:14px}.logo-mark{height:38px;width:38px}.content{padding:15px}.nav{padding:7px}.nav button{padding:12px 11px;font-size:11px}.grid-metrics{gap:8px}.metric{padding:14px;min-height:100px}.metric .v{font-size:29px}.market-row{gap:4px}.market-btn{font-size:9px}.market-btn strong{font-size:12px}.people{grid-template-columns:1fr}.team-grid{grid-template-columns:1fr}.team span{font-size:12px}.week-tools span{min-width:135px}.rank-row{padding:11px 10px;gap:10px}.rank-points{gap:6px}.footer{flex-direction:column;align-items:flex-start}.player-select{max-width:112px}.panel-heading{align-items:flex-start;flex-direction:column}}
/* ════════════════════════════════════════════════════════════════════
   EL TEMPLO DE LA PORRA — 1999 DELUXE
   Sistema visual unificado: color, texturas, sombras, tipografía y motion
   ════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme:light;
  --wine:#7B112C; --grass:#168B45; --gold:#FFD431; --pink:#FF42AC;
  --cream:#FFF0CF; --ink:#181313; --blue90:#2455FF; --fire:#FF682D;
  --paper:#FFF9E8; --darkwine:#45071B; --white:#FFFFFF;
  --display:'Archivo Black',Impact,'Arial Black',sans-serif;
  --pixel:'Space Mono','Courier New',monospace;
  --serif:'Bree Serif',Georgia,serif;
  --body:'DM Sans',system-ui,sans-serif;
  --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  --bg:var(--cream); --surface:var(--paper); --surface2:#fff7e3;
  --line:var(--ink); --fg:var(--ink); --muted:#634d42;
  --lime:var(--gold); --blue:var(--blue90); --amber:#915114; --red:#A42533;
}
html {scroll-behavior:smooth;}
body {
  color:var(--ink);font-family:var(--body);min-height:100vh;
  background-color:var(--cream);
  background-image:
    radial-gradient(circle at 15% 12%,#ff42ac22 0 6%,transparent 6.2%),
    radial-gradient(circle at 83% 36%,#ffd43155 0 8%,transparent 8.1%),
    repeating-linear-gradient(0deg,transparent 0 27px,#7b112c09 27px 28px),
    repeating-linear-gradient(90deg,transparent 0 27px,#7b112c09 27px 28px);
  background-size:auto,auto,28px 28px,28px 28px;
}
button,input,select {font-family:var(--body);}
button:focus-visible,input:focus-visible,select:focus-visible {outline:4px solid var(--blue90);outline-offset:3px;}
button:active:not(:disabled) {transform:translate(2px,2px)!important;box-shadow:1px 1px 0 var(--ink)!important;}
button:disabled {opacity:.48;filter:grayscale(.4);}
.container {max-width:1310px;}
.retro-strip {background:var(--gold);color:var(--ink);border-bottom:3px solid var(--ink);font:700 10px var(--pixel);letter-spacing:.06em;}
.strip-inner {display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:7px;padding-bottom:7px;}
.strip-blink {background:var(--grass);color:#fff;border:2px solid var(--ink);padding:2px 8px;animation:blink-lite 1.3s steps(2,end) infinite;}
@keyframes blink-lite{50%{opacity:.65}}
.top {background:var(--wine);border-bottom:5px solid var(--ink);box-shadow:0 5px 0 var(--gold);backdrop-filter:none;position:relative;z-index:2;}
.top-inner {min-height:98px;gap:18px;}
.logo {gap:14px;min-width:0;color:#fff;}
.logo-mark {position:relative;width:67px;height:67px;background:var(--gold);border:3px solid var(--ink);border-radius:5px;box-shadow:var(--hard);transform:rotate(-6deg);font-size:38px;line-height:1;}
.logo-mark small {position:absolute;bottom:-9px;right:-17px;background:var(--pink);border:2px solid var(--ink);padding:2px 5px;font:700 9px var(--pixel);transform:rotate(6deg);white-space:nowrap;}
.logo-title {color:var(--cream);font:normal clamp(17px,2.1vw,26px)/1.05 var(--display);letter-spacing:-.045em;text-shadow:3px 3px 0 var(--ink);}
.logo-title i {font-style:normal;color:var(--gold);}
.logo-sub {color:#ffdfbd;font:700 9px var(--pixel);letter-spacing:.05em;margin-top:10px;}
.session {justify-content:flex-end;gap:10px;}
.pill {background:var(--gold);border:2px solid var(--ink);border-radius:2px;color:var(--ink);box-shadow:var(--hard-sm);font:700 10px var(--pixel);padding:9px 12px;}
.pill.light {background:var(--pink);border-color:var(--ink);color:var(--ink);}
.player-label {display:flex;flex-direction:column;gap:4px;color:var(--cream);font:700 10px var(--pixel);letter-spacing:.06em;}
.player-select {background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);font-weight:900;min-height:43px;max-width:172px;}
.cash-shortcut {display:flex;align-items:center;gap:9px;background:var(--pink);color:var(--ink);border:3px solid var(--ink);border-radius:3px;padding:11px 14px;box-shadow:var(--hard-sm);font:700 12px var(--pixel);transform:rotate(-2deg);}
.cash-shortcut span {background:var(--ink);color:var(--gold);padding:4px 7px;font:700 11px var(--pixel);}
.cash-shortcut:hover {background:var(--gold);transform:rotate(1deg) translateY(-2px);}
.hero {position:relative;isolation:isolate;overflow:hidden;min-height:386px;margin-top:28px;padding:34px 38px 28px;background:var(--grass);border:5px solid var(--ink);box-shadow:9px 9px 0 var(--ink);color:#fff;align-items:stretch;gap:22px;}
.hero:before {content:'';position:absolute;z-index:-1;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 105px,#ffffff12 105px 210px),radial-gradient(circle at 100% 0%,#ffffff30,transparent 53%);}
.hero:after {content:'';position:absolute;z-index:-1;inset:9px;border:2px dashed #ffffff90;pointer-events:none;}
.hero-copy {position:relative;z-index:1;max-width:690px;flex:1;}
.eyebrow {display:inline-block;background:var(--gold);color:var(--ink);padding:7px 13px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:700 10px var(--pixel);letter-spacing:.03em;transform:rotate(-2deg);}
.eyebrow:before {display:none;}
h1 {font:normal clamp(52px,7.3vw,109px)/.87 var(--display);letter-spacing:-.065em;margin:27px 0 20px;color:var(--cream);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:6px 7px 0 var(--ink);}
h1 em {font-style:normal;color:var(--gold);}
h1 em span {color:var(--pink);}
.hero p {color:#fffce9;font-size:14px;line-height:1.65;font-weight:800;max-width:560px;}
.hero-tags {display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;}
.hero-tags span {background:var(--cream);border:2px solid var(--ink);color:var(--ink);padding:7px 11px;font:700 10px var(--pixel);box-shadow:3px 3px 0 var(--ink);}
.hero-tags span:nth-child(2) {background:var(--pink);transform:rotate(-2deg);}
.hero-tags span:nth-child(3) {background:var(--gold);transform:rotate(2deg);}
.hero-aside {display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;min-width:280px;}
.sticker-collage {position:relative;width:302px;height:226px;pointer-events:none;}
.sticker {position:absolute;display:grid;place-items:center;background:var(--cream);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:50%;text-shadow:1px 3px 0 #18131330;transition:transform .2s;}
.sticker-ball {left:21px;top:16px;width:130px;height:130px;font-size:86px;transform:rotate(-14deg);animation:floatball 3.1s ease-in-out infinite;}
.sticker-wine {left:141px;top:0;width:114px;height:114px;background:var(--pink);font-size:76px;transform:rotate(15deg);}
.sticker-steak {left:144px;top:112px;width:114px;height:91px;border-radius:17px;background:var(--gold);font-size:64px;transform:rotate(-15deg);}
.sticker-star {left:12px;top:146px;width:68px;height:68px;font-size:42px;background:var(--fire);color:var(--gold);transform:rotate(12deg);}
.sticker-caption {position:absolute;right:8px;bottom:-3px;background:var(--wine);color:var(--cream);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:700 10px/1.5 var(--pixel);padding:8px 12px;transform:rotate(5deg);text-align:center;}
@keyframes floatball {0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-10px) rotate(-9deg)}}
.week-tools {display:flex;align-items:center;justify-content:center;gap:8px;background:var(--cream);border:3px solid var(--ink);border-radius:3px;padding:6px;box-shadow:var(--hard);color:var(--ink);}
.week-tools span {font:700 11px var(--pixel);min-width:160px;white-space:normal;line-height:1.4;}
.square {background:var(--gold);border:2px solid var(--ink);border-radius:2px;color:var(--ink);width:39px;height:39px;font-size:26px;font-weight:900;box-shadow:2px 2px 0 var(--ink);}
.square:hover {background:var(--pink);}
.ticker {overflow:hidden;border:3px solid var(--ink);background:var(--wine);color:var(--gold);margin:21px 0 15px;box-shadow:4px 4px 0 var(--ink);white-space:nowrap;}
.ticker-track {width:max-content;padding:9px 10px;font:700 12px var(--pixel);letter-spacing:.075em;animation:ticker-scroll 28s linear infinite;}
@keyframes ticker-scroll{to{transform:translateX(-47%)}}
.grid-metrics {gap:14px;margin:20px 0 29px;}
.metric {position:relative;min-width:0;min-height:138px;padding:18px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:3px;box-shadow:var(--hard);transform:rotate(-1deg);}
.metric:nth-child(2){background:var(--pink);transform:rotate(1deg)}
.metric:nth-child(3){background:var(--blue90);color:white;transform:rotate(-.6deg)}
.metric.accent {background:var(--wine);color:var(--cream);border-color:var(--ink);transform:rotate(1deg)}
.metric .k {font:700 10px/1.4 var(--pixel);color:inherit;text-transform:uppercase;}
.metric .v {font:normal clamp(26px,3.7vw,47px)/1 var(--display);color:inherit;letter-spacing:-.05em;margin-top:19px;text-shadow:2px 2px 0 #0000001c;overflow-wrap:anywhere;}
.metric .v small,.metric.accent .k,.metric.accent .v small {font:700 11px var(--pixel);color:inherit;}
.metric:after {content:'✦';position:absolute;right:12px;bottom:7px;font:28px var(--serif);opacity:.36;}
.alert {border:3px solid var(--ink);border-radius:3px;color:var(--ink);background:#FFE0B0;box-shadow:var(--hard-sm);font-weight:700;margin:0 0 15px;}
.alert.warn {background:#FFDFB5;border-color:var(--ink);color:#54250F;}
.alert.success {background:#C6F3B9;border-color:var(--ink);color:#123F1E;}
.legend {font:600 11px/1.6 var(--body);color:var(--muted);margin:18px 0;}
.main-card {background:var(--paper);border:4px solid var(--ink);border-radius:4px;box-shadow:9px 9px 0 var(--ink);overflow:visible;}
.nav {background:var(--wine);border-bottom:4px solid var(--ink);padding:10px;gap:9px;flex-wrap:nowrap;scrollbar-width:thin;}
.nav button {flex:1;min-width:max-content;background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:2px;padding:13px 14px;box-shadow:3px 3px 0 var(--ink);font:800 12px var(--body);transition:transform .12s,background .12s;}
.nav button:hover {background:var(--gold);transform:translateY(-3px);}
.nav button.active {background:var(--gold);color:var(--ink);box-shadow:inset 2px 2px 0 #ffffffaa,3px 3px 0 var(--ink);}
.nav button[data-tab='cash'] {background:var(--pink);}
.nav button[data-tab='cash'].active {background:var(--gold);}
.nav button .bubble {background:var(--ink);color:var(--gold);border-radius:2px;}
.content {padding:30px;background:radial-gradient(circle at 100% 0,#ff42ac16,transparent 42%),var(--paper);min-height:280px;}
h2 {font:normal clamp(21px,2.8vw,32px)/1.17 var(--display);color:var(--wine);letter-spacing:-.045em;text-transform:uppercase;text-shadow:2px 2px 0 #ffd4318c;}
.description {color:var(--muted);font-size:13px;font-weight:650;line-height:1.6;}
.panel-heading {border-bottom:3px dashed var(--wine);padding-bottom:17px;margin-bottom:23px;}
.btn {background:var(--cream);border:3px solid var(--ink);color:var(--ink);border-radius:3px;box-shadow:var(--hard-sm);font:800 12px var(--pixel);padding:12px 16px;white-space:normal;transition:transform .14s,background .14s;}
.btn:not(:disabled):hover {transform:translateY(-3px) rotate(-1deg);background:var(--pink);}
.btn.primary {background:var(--gold);border-color:var(--ink);color:var(--ink);}
.btn.primary:hover {background:var(--pink);}
.btn.ghost {background:var(--paper);}
.btn.small {border-radius:2px;}
.btn.danger {background:#FFD8D0;color:var(--wine);border-color:var(--ink);}
.filter {background:white;border:3px solid var(--ink);border-radius:3px;color:var(--ink);box-shadow:var(--hard-sm);padding:12px;}
.chip {background:var(--cream);border:2px solid var(--ink);border-radius:3px;color:var(--ink);box-shadow:2px 2px 0 var(--ink);font:700 10px var(--pixel);}
.chip.on {background:var(--grass);color:white;border-color:var(--ink);}
.match {position:relative;background:#fffdf5;border:3px solid var(--ink);border-radius:3px;box-shadow:var(--hard-sm);padding:16px;margin-bottom:16px;}
.match:before {content:'✦';position:absolute;top:-11px;left:18px;display:grid;place-items:center;width:21px;height:21px;background:var(--gold);border:2px solid var(--ink);border-radius:50%;font-size:14px;}
.match:hover {border-color:var(--wine);transform:translateY(-1px);}
.match.used {background:#E8FAD8;border-color:var(--grass);box-shadow:5px 5px 0 var(--ink);}
.match-top {color:var(--wine);font:700 10px var(--pixel);gap:6px;flex-wrap:wrap;}
.match-top span:first-child {background:var(--wine);color:white;padding:4px 6px;}
.team span {color:var(--ink);font-size:13px;font-weight:900;}
.team img {height:31px;width:31px;}
.vs {background:var(--gold);border:2px solid var(--ink);padding:6px 7px;color:var(--ink);font:700 11px var(--pixel);transform:rotate(-9deg);}
.market-btn {position:relative;background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:2px;box-shadow:2px 2px 0 var(--ink);font-size:10px;font-weight:900;line-height:1.45;padding:10px 2px;}
.market-btn:hover:not(:disabled) {background:var(--pink);transform:translateY(-2px);}
.market-btn strong {font:700 14px var(--pixel);color:var(--ink);}
.market-btn.chosen {background:var(--grass);border-color:var(--ink);color:white;}
.market-btn.chosen strong {color:var(--gold);}
.market-btn.missing strong {color:#87736c;}
.market-btn.chosen.missing strong {color:white;}
.draft-sidebar {background:var(--wine);border:4px solid var(--ink);border-radius:3px;box-shadow:var(--hard);padding:19px;color:white;top:18px;}
.draft-sidebar:before {content:'🎟 BOLETO OFICIAL';display:block;margin:-19px -19px 17px;padding:10px 14px;background:var(--gold);border-bottom:3px dashed var(--ink);color:var(--ink);font:700 12px var(--pixel);letter-spacing:.04em;}
.sidebar-top h3 {font:normal 19px var(--display);color:var(--cream);}
.counter {font:700 12px var(--pixel);color:var(--gold);}
.slot {background:var(--cream);border:2px dashed var(--ink);border-radius:2px;color:var(--ink);}
.slot.filled {background:white;border-style:solid;}
.slot-num {background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:2px;font-family:var(--pixel);}
.slot strong {color:var(--ink);font-weight:800;}
.slot small {color:var(--muted);}
.slot .price {color:var(--wine);font:700 13px var(--pixel);}
.slot .remove {color:var(--wine);font-weight:900;font-size:25px;}
.combined {background:var(--grass);border:3px solid var(--ink);border-radius:3px;box-shadow:var(--hard-sm);padding:16px;color:white;}
.combined small {color:#fff;font:700 10px var(--pixel);}
.combined b {color:var(--gold);font:normal clamp(26px,3vw,43px) var(--display);overflow-wrap:anywhere;}
.combined p {color:#f0ffe4;font-weight:650;}
.draft-sidebar .note {color:var(--cream);}
.note {color:var(--muted);font-size:11px;line-height:1.6;}
.empty {border:3px dashed var(--wine);border-radius:3px;background:#fff9e7;color:var(--muted);}
.rank-row {background:#fffdf4;border:3px solid var(--ink);border-radius:2px;box-shadow:var(--hard-sm);margin-bottom:5px;}
.rank-row.top {background:#DDFFD0;border-color:var(--ink);}
.rank-num,.rank-row.top .rank-num {background:var(--gold);border:2px solid var(--ink);border-radius:2px;color:var(--ink);font:700 13px var(--pixel);}
.rank-body strong {color:var(--ink);font-weight:900;}
.rank-body small {color:var(--muted);}
.rank-stat b {color:var(--wine);font:700 16px var(--pixel);}
.rank-stat span {color:var(--muted);font:700 9px var(--pixel);}
.status-chip {background:var(--grass);color:white;border:1px solid var(--ink);border-radius:2px;}
.status-chip.wait {background:var(--gold);color:var(--ink);}
.vote-choice {background:var(--cream);border:3px solid var(--ink);border-radius:3px;box-shadow:var(--hard-sm);}
.vote-choice.selected {background:#DCF6CF;border-color:var(--grass);}
.vote-choice .check {border:2px solid var(--ink);border-radius:2px;background:white;color:var(--ink);}
.vote-choice.selected .check {background:var(--gold);border-color:var(--ink);}
.vote-choice .body b {color:var(--ink);}
.vote-choice .body small {color:var(--muted);}
.vote-choice .count {color:var(--wine);font:700 11px var(--pixel);}
.block {background:var(--cream);border:3px solid var(--ink);border-radius:3px;box-shadow:var(--hard-sm);}
.block h3 {font:normal 18px var(--display);color:var(--wine);}
.block p {color:var(--muted);font-size:12px;font-weight:650;}
.final-item {border-color:#bd9e89;}
.final-item .n {border:2px solid var(--ink);border-radius:2px;background:var(--gold);color:var(--ink);font-family:var(--pixel);}
.final-item .detail strong {color:var(--ink);}
.final-item .detail small {color:var(--muted);}
.final-item .p {color:var(--wine);font:700 13px var(--pixel);}
.final-total {color:var(--ink);border-top:3px dashed var(--wine);font-weight:800;}
.final-total b {color:var(--wine);font:normal 27px var(--display);}
.person {background:white;border:3px solid var(--ink);border-radius:3px;box-shadow:var(--hard-sm);}
.person:nth-child(3n+2) {background:#FFF6D7;}
.person-title b {color:var(--wine);font:normal 17px var(--display);}
.avatar {background:var(--pink);border:2px solid var(--ink);border-radius:3px;color:var(--ink);box-shadow:2px 2px 0 var(--ink);}
.person-row {border-color:#d8bfb2;color:var(--ink);}
.person-row .price {color:var(--wine);font-family:var(--pixel);}
.person-row span,.person-total {color:var(--muted);}
.person-total b {color:var(--wine);font-family:var(--display);}
.team-tile {background:white;border:2px solid var(--ink);border-radius:2px;color:var(--ink);box-shadow:2px 2px 0 var(--ink);}
.team-tile:nth-child(even){background:#fff0c6;}
.team-tile:hover {background:var(--gold);transform:rotate(-1deg) translateY(-2px);}
.footer {color:var(--cream);background:var(--wine);max-width:none;padding:20px max(22px,calc((100% - 1266px)/2));margin-top:0;border-top:5px solid var(--ink);font:700 10px/1.6 var(--pixel);}
.bottom-banner {display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:42px auto 25px;padding:15px;font:normal clamp(13px,2vw,22px) var(--display);color:var(--wine);text-align:center;}
.bottom-banner span {font-size:30px;filter:drop-shadow(2px 2px 0 var(--ink));}
.overlay {background:#181313d9;backdrop-filter:blur(3px);}
.modal {background:var(--cream);border:5px solid var(--ink);border-radius:3px;box-shadow:12px 12px 0 var(--pink);}
.modal h2 {color:var(--wine);}
.modal p {color:var(--muted);}
.modal input {background:white;border:3px solid var(--ink);color:var(--ink);border-radius:2px;}
.spin {border-color:var(--wine);border-top-color:var(--gold);}
/* Caja: máquina tragaperras, marcador de estadio y ticket de carnicería vintage */
.cash-heading {position:relative;}
.cash-heading-actions {display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.cash-refresh {background:var(--cream);}
.cash-stage {position:relative;isolation:isolate;overflow:hidden;text-align:center;background:var(--wine);color:var(--cream);border:6px solid var(--ink);box-shadow:9px 9px 0 var(--ink);padding:35px 18px 40px;}
.cash-stage:before {content:'';position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 50% 0,#ff42ac55,transparent 50%),repeating-linear-gradient(90deg,#ffffff09 0 3px,transparent 3px 17px);}
.cash-stage:after {content:'';position:absolute;inset:12px;border:2px dashed var(--gold);pointer-events:none;}
.cash-bunting {display:inline-block;max-width:100%;background:var(--gold);color:var(--ink);border:3px solid var(--ink);padding:7px 15px;font:700 10px var(--pixel);box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);}
.cash-icons {display:flex;justify-content:center;gap:18px;font-size:45px;margin-top:13px;}
.cash-icons span {display:inline-block;filter:drop-shadow(4px 4px 0 var(--ink));animation:cash-dance 3s ease-in-out infinite;}
.cash-icons span:nth-child(2) {animation-delay:.2s;transform:rotate(-9deg)}
.cash-icons span:nth-child(3) {animation-delay:.4s;}
@keyframes cash-dance {50%{translate:0 -7px;rotate:5deg;}}
.cash-overline {font:700 10px var(--pixel);letter-spacing:.07em;color:#ffe4c0;margin:17px 0 8px;}
.cash-money {font:normal clamp(34px,8.5vw,112px)/1.15 var(--display);color:var(--gold);text-shadow:5px 6px 0 var(--ink);-webkit-text-stroke:1px var(--ink);overflow-wrap:anywhere;letter-spacing:-.05em;}
.cash-underline {display:inline-block;padding:6px 15px;background:var(--grass);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:700 10px var(--pixel);margin-top:12px;}
.cash-seal {position:absolute;right:22px;bottom:21px;width:77px;height:77px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px dashed var(--ink);border-radius:50%;background:var(--pink);color:var(--ink);font:normal 34px var(--display);transform:rotate(15deg);}
.cash-seal small {font:700 8px/1.1 var(--pixel);}
.cash-bottom {display:grid;grid-template-columns:minmax(0,1.15fr) minmax(275px,.85fr);gap:25px;align-items:start;margin-top:28px;}
.cash-editor {background:var(--gold);padding:22px;}
.cash-editor-top {display:flex;gap:13px;align-items:flex-start;}
.cash-editor-top h3 {font-size:22px;margin-top:7px;}
.cash-doodle {font-size:44px;filter:drop-shadow(3px 3px 0 #0002);}
.cash-input-label {display:block;font:700 12px var(--pixel);margin:16px 0 10px;color:var(--wine);}
.cash-form {display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;}
.cash-input-wrap {display:flex;align-items:center;gap:6px;background:white;border:4px solid var(--ink);box-shadow:var(--hard-sm);padding:0 14px;flex:1;min-width:150px;}
.cash-input-wrap span {font:normal 31px var(--display);color:var(--wine);}
.cash-input-wrap input {min-width:0;width:100%;border:0;background:white;color:var(--ink);padding:13px 4px;font:700 clamp(19px,2.4vw,28px) var(--pixel);outline-offset:0;}
.cash-input-wrap input:focus-visible {outline:3px solid var(--blue90);}
.cash-save {background:var(--pink)!important;min-height:64px;flex-grow:1;}
.cash-editor .note {font-size:11px;color:#533619;margin-top:15px;}
.cash-receipt {background:#fffdf4;border:3px solid var(--ink);padding:17px 22px 22px;box-shadow:5px 5px 0 var(--ink);position:relative;transform:rotate(1deg);}
.cash-receipt:after {content:'';height:10px;position:absolute;left:0;right:0;bottom:-11px;background:linear-gradient(135deg,#fffdf4 25%,transparent 25%) -6px 0/12px 12px,linear-gradient(225deg,#fffdf4 25%,transparent 25%) -6px 0/12px 12px;}
.receipt-head {font:700 9px var(--pixel);color:var(--wine);text-align:center;border-bottom:2px dashed var(--ink);padding-bottom:13px;}
.receipt-icon {font-size:45px;text-align:center;margin-top:10px;}
.cash-receipt h3 {font:normal 17px var(--serif);text-align:center;margin:6px 0 20px;}
.receipt-row {display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px dashed #978a7e;font:700 10px var(--pixel);}
.receipt-row strong {text-align:right;font:700 12px var(--body);overflow-wrap:anywhere;}
.receipt-footer {text-align:center;color:var(--wine);font:700 11px/1.9 var(--pixel);margin-top:22px;}
.receipt-footer small {font:700 8px var(--pixel);}
/* Escalas y preferencias de accesibilidad */
@media (hover:hover) { .sticker-collage:hover .sticker-ball {animation:none;transform:rotate(8deg) translateY(-7px);} .sticker-collage:hover .sticker-wine {transform:rotate(24deg) translateY(-8px);} }

  .eyebrow {font-size:8px;padding:7px;}

function mergeBackup(backup){
 var incoming=cleanDB(backup);

function equalJSON(a,b){return JSON.stringify(a)===JSON.stringify(b);}

function changesBetween(before,after,path,ops){

 // Caja y cada marcador se escriben completos para mantener el registro coherente.

   var keys=new Set(Object.keys(before).concat(Object.keys(after)));

     }else changesBetween(before[key],after[key],path.concat(key),ops);
   });

function applyChangesLocally(target,ops){

async function commonRequest(path,options){

async function sendPatch(ops){

// Todos los guardados viajan a PostgreSQL y se confirman ANTES de anunciar éxito.
function persist(){

   var ops=changesBetween(commonBase,db);

   commonBase=cleanDB(result.database);
   db=copyJSON(commonBase);
   applyChangesLocally(db,newLocalChanges);

 });

}
async function syncFromCommon(){

function oddFor(pick){
  if(!data)return null;
  var live=data.odds&&data.odds[String(pick.fixtureId)];
  var current=live&&num(live[pick.market]);
  if(current)return current;
  return num(pick.savedOdd)||(data.archivedOdds&&num(data.archivedOdds[pickId(pick)]))||null;
}
function label(pick){var f=fixture(pick.fixtureId);if(!f)return pick.market;return ({H:'Gana '+f.home,D:'Empate',A:'Gana '+f.away,BY:'Ambos marcan · Sí',BN:'Ambos marcan · No'})[pick.market]||pick.market;}
function combo(picks){if(!picks || picks.length!==4)return null;var total=1;for(var i=0;i<picks.length;i++){var odd=oddFor(picks[i]);if(odd===null||odd===undefined)return null;total*=odd;}return total;}
function nameMatch(p){var f=fixture(p.fixtureId);return f?f.home+' · '+f.away:'Partido desconocido';}
function pickId(p){return String(p.fixtureId)+':'+p.market;}
function serverRows(){return data&&data.ranking||[];}

function available(f){return !!(data&&data.publication&&data.publication.open)&&new Date(f.start).getTime()>Date.now();}

async function request(url,options){
 if(url.indexOf('/api/state')===0){var p=new URLSearchParams(url.split('?')[1]||''),w=p.get('week')||week;return buildState(w,p.get('competition')||competition);}
 var body=options&&options.body?JSON.parse(options.body):{},path=url;
 if(path==='/api/cash'){
   var cents=parseAmount(body.amount);db.cash={cents:cents,updatedBy:players.includes(body.player)?body.player:'Anónimo',at:new Date().toISOString()};await persist();return {ok:true,message:'¡Caja actualizada para todos!',cash:db.cash};
 }
 var w=body.week||week,type=safeCompetition(body.competition||competition),b=localWeek(w,type);
 if(path==='/api/submission'){
  if(!players.includes(body.player))throw new Error('Selecciona primero tu nombre.');validatePicks(body.picks,w,type);
  var odds=weekOdds(w,weekFixtures(w,type),type);b.submissions[body.player]={picks:body.picks.map(function(p){return {fixtureId:p.fixtureId,market:p.market,savedOdd:validOdd(odds[String(p.fixtureId)]&&odds[String(p.fixtureId)][p.market])};}),at:new Date().toISOString()};await persist();return {ok:true,message:'Tus cuatro pronósticos están guardados para todos.'};
 }
 if(path==='/api/vote'){
  if(!players.includes(body.player))throw new Error('Selecciona tu nombre.');validateBallot(body.ids,w,type);b.votes[body.player]={ids:body.ids,at:new Date().toISOString()};await persist();return {ok:true,message:'Tu votación está guardada para todos.'};
 }
 if(path==='/api/fix'){
  if(!publication(w,type,weekFixtures(w,type)).open)throw new Error('Esta quiniela está fuera de su periodo de publicación.');
  var state=buildState(w,type),byId=new Map(state.ranking.map(function(r){return [r.id,r];}));if(!Array.isArray(body.ids)||body.ids.length!==4||new Set(body.ids).size!==4)throw new Error('Debes elegir exactamente cuatro propuestas.');
  var selected=body.ids.map(function(k){return byId.get(k);});if(selected.some(function(r){return !r;})||new Set(selected.map(function(r){return r.fixtureId;})).size!==4)throw new Error('Debes seleccionar cuatro partidos diferentes.');
  if(selected.some(function(r){return !canEditFixture(state.fixtures.find(function(f){return f.id===r.fixtureId;}),w,type);}))throw new Error('No se pueden fijar partidos ya comenzados.');
  b.ticket=frozenTicket(w,type,state.ranking,body.ids,state.fixtures,state.odds);
  b.fixed={ids:body.ids,at:b.ticket.fixedAt};await persist();return {ok:true,message:'¡Combinada fijada y archivada para todos! Ya aparece en el historial común.'};
 }
 if(path==='/api/unfix'){b.fixed=null;b.ticket=null;await persist();return {ok:true,message:'Combinada desfijada y retirada del historial común.'};}
 throw new Error('Ruta desconocida: '+path);
}
async function load(){
  busy=true;
  try{
    await syncFromCommon();
    var fresh=await request('/api/state?week='+encodeURIComponent(week)+'&competition='+encodeURIComponent(competition));
    data=fresh;
    if(initializedWeek!==weekKey(week,competition)){
      draft=((data.submissions[selectedPlayer]||{}).picks||[]).slice();
      ballot=((data.votes[selectedPlayer]||{}).ids||[]).slice();
      manual=(data.consensus.selected||[]).slice();
      initializedWeek=weekKey(week,competition);
    }
  }catch(e){notice='No se pudieron cargar los datos compartidos: '+e.message;noticeType='error';}
  finally{busy=false;render();if(data)refreshResults(false);}
}
async function post(url,body){
  busy=true;render();
  try{
    var result=await request(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    notice=result.message;noticeType='success';
    if(url==='/api/cash')cashDraft=null;
    initializedWeek='';
    await load();
  }catch(e){busy=false;notify(e.message,'error');}
}

  }
  if(action==='delete-fixture'){
    if(!canAddManualFixture(week,competition)){notify('No se pueden quitar partidos fuera de la ventana de esta edición.','error');return;}
    var fid=Number(t.dataset.id),used=Object.values(localWeek(week,competition).submissions).some(function(s){return (s.picks||[]).some(function(p){return p.fixtureId===fid;});});if(used){notify('Este partido ya tiene pronósticos guardados; no se puede borrar.','error');return;}
    if(!confirm('¿Quitar este partido manual de esta semana?'))return;
    localWeek(week,competition).fixtures=localWeek(week,competition).fixtures.filter(function(f){return f.id!==fid;});delete localWeek(week,competition).manualOdds[String(fid)];persist().then(function(){load();}).catch(function(e){notify(e.message,'error');});return;
  }
  if(action==='import-legacy'){
    if(!legacyDb||!Object.keys(legacyDb.weeks||{}).length)return;
    if(!confirm('Se añadirán los datos antiguos de este navegador a la base común, sin borrar las apuestas de los demás. ¿Continuar?'))return;
    mergeBackup(legacyDb);
    persist().then(function(){legacyDb=null;notice='Datos antiguos fusionados con la base común.';noticeType='success';initializedWeek='';load();}).catch(function(e){notify(e.message,'error');});return;
  }
  if(action==='refresh-odds'){refreshSource(true);notice='Consultando las cuotas públicas…';noticeType='success';render();return;}
  if(action==='export'){var text=JSON.stringify({version:1,createdAt:new Date().toISOString(),database:db},null,2),blob=new Blob([text],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='copia-chuletonbet.json';a.click();setTimeout(function(){URL.revokeObjectURL(u);},1000);return;}
  if(action==='import'){
    var input=document.createElement('input');input.type='file';input.accept='.json,application/json';
    input.onchange=function(){var f=input.files[0];if(!f)return;
      f.text().then(function(raw){
        var obj=JSON.parse(raw);
        if(obj.version!==1||!obj.database||!obj.database.weeks)throw new Error('Formato de copia no reconocido.');
        if(!confirm('Se FUSIONARÁ esta copia con los datos de todos, conservando el registro más reciente de cada jugador. ¿Continuar?'))return;
        mergeBackup(obj.database);
        persist().then(function(){initializedWeek='';notice='Copia fusionada con los datos compartidos.';noticeType='success';load();}).catch(function(e){notify('No se pudo importar: '+e.message,'error');});
      }).catch(function(e){notify('No se pudo importar: '+e.message,'error');});
    };input.click();return;
  }


  if(action==='save-cash'){var cashField=document.getElementById('cash-amount');if(!cashField)return;cashDraft=cashField.value;post('/api/cash',{amount:cashDraft,player:selectedPlayer||null});return;}
  if(action==='dismiss'){notice='';render();return;}
  if(action==='filter'){filter=t.dataset.filter;render();return;}
  if(action==='prev'||action==='next'){
    var n=action==='prev'?-7:7;
    var next=addDays(week,n),days=(Date.parse(next+'T12:00:00Z')-Date.parse(mondayISO(todayMadrid())+'T12:00:00Z'))/86400000;
    if(days< -28||days>77){notify('No hay más semanas disponibles en esta dirección.','error');return;}
    week=next;search='';data=null;load();return;
  }
  if(action==='market'){applyMarket(t.dataset.id,t.dataset.market);return;}
  if(action==='remove'){draft.splice(Number(t.dataset.index),1);render();return;}
  if(action==='reset'){draft=((data.submissions[selectedPlayer]||{}).picks||[]).slice();render();return;}
  if(action==='submit'){
    if(!data.publication.open||draft.length!==4)return;
    requirePin(function(secret){post('/api/submission',{week:week,competition:competition,player:selectedPlayer,pin:secret,picks:draft});});return;
  }
  if(action==='vote-toggle'){if(!selectedPlayer){notify('Selecciona tu nombre para votar.','error');return;}toggleVote(t.dataset.id,'ballot');return;}
  if(action==='submit-vote'){
    requirePin(function(secret){post('/api/vote',{week:week,competition:competition,player:selectedPlayer,pin:secret,ids:ballot});});return;
  }
  if(action==='fix-auto'){if(!data.publication.open||!data.consensus.complete||data.consensus.fixed)return;post('/api/fix',{week:week,competition:competition,ids:data.consensus.selected.slice()});return;}
  if(action==='manual-mode'){manual=(data.consensus.selected||[]).slice();modal=true;render();return;}
  if(action==='manual-toggle'){toggleVote(t.dataset.id,'manual');return;}
  if(action==='close-modal'){modal=false;render();return;}
  if(action==='submit-fix'){if(data.publication.open&&manual.length===4){modal=false;post('/api/fix',{week:week,competition:competition,adminPin:adminPin,ids:manual});}return;}
  if(action==='unfix'){if(!confirm('¿Desfijar esta combinada? Se quitará del historial hasta que se vuelva a fijar.'))return;modal=false;post('/api/unfix',{week:week,competition:competition,adminPin:adminPin});return;}
});
load();
// El HTML funciona al instante, incluso sin internet; la consulta remota va en paralelo.
refreshSource(false);
setInterval(async function(){
 if(document.visibilityState!=='visible'||busy||commitsPending||!data||
    (document.activeElement&&document.activeElement.id==='cash-amount'))return;
 try{
   await syncFromCommon();
   data=buildState(week,competition);
   render();
 }catch(e){commonSyncError=e.message;}
},12000);
setInterval(function(){
 if(document.visibilityState==='visible'&&data){
   if(Date.now()-(remote.updatedAt||0)>12*60000)refreshSource(false);
   refreshResults(false);
 }
},120000);
window.addEventListener('focus',function(){if(data&&!busy&&!commitsPending)syncFromCommon().then(function(){data=buildState(week,competition);render();}).catch(function(e){commonSyncError=e.message;});});
})();
</script>
